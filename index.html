<style>
:root{color-scheme:dark;--bg:#10131f;--panel:#191e2e;--panel2:#20273a;--line:#343c54;--text:#f4f5fb;--muted:#b2bbd0;--accent:#8b7cff;--cyan:#65d9e8;--green:#6ee7a8;--red:#ff7588;--gold:#ffd166;--shadow:0 18px 55px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#29264a 0,transparent 48%),var(--bg);color:var(--text);font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:14px 20px;font-weight:750;transition:transform .15s,border-color .15s,background .15s}button:hover{transform:translateY(-2px);border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}button.primary{background:linear-gradient(135deg,#7869f7,#554bd0);border-color:#9388ff}button.success{background:#174b3b;border-color:#317d61}button.danger{background:#492532;border-color:#784050}button.ghost{background:transparent}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.hidden{display:none!important}.wrap{max-width:1420px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;font-size:20px;letter-spacing:.01em}.brand span{color:var(--cyan)}.top-actions{display:flex;gap:10px}.screen{animation:appear .25s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero{min-height:72vh;display:grid;place-items:center;text-align:center}.hero-inner{max-width:920px}.eyebrow{color:var(--cyan);font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:850}.hero h1{font-size:clamp(42px,7vw,86px);line-height:1.02;margin:18px 0}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{font-size:clamp(20px,2.4vw,28px);color:var(--muted);max-width:780px;margin:0 auto 30px}.button-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.button-row button{font-size:20px;min-height:60px}.card{background:linear-gradient(145deg,#1c2233,#171c2a);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}.narrow{max-width:850px;margin:0 auto}.section-title{font-size:clamp(32px,4vw,48px);line-height:1.1;margin:0 0 22px}.subtle{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field label,.field-label{display:block;color:var(--muted);font-weight:750;margin-bottom:8px}.field input,.field textarea,textarea,input[type=text]{width:100%;background:#101522;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text)}.field input{font-size:21px}.field textarea{min-height:140px;resize:vertical}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0;padding:16px;background:#121725;border:1px solid var(--line);border-radius:14px}.setting-row strong{display:block}.segmented{display:flex;gap:8px;flex-wrap:wrap}.segmented button{padding:10px 14px}.segmented button.selected{background:#393265;border-color:var(--accent);color:#fff}.range-line{display:flex;align-items:center;gap:15px;min-width:240px}.range-line input{accent-color:var(--accent)}.game-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.round-chip,.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#1c2233;padding:7px 13px;border-radius:99px;color:var(--muted);font-weight:750}.phase-progress{display:flex;gap:7px;margin:18px 0 22px}.phase-dot{height:8px;flex:1;border-radius:9px;background:#343b50}.phase-dot.done{background:var(--green)}.phase-dot.current{background:var(--accent);box-shadow:0 0 16px #8b7cff88}.phase-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.main-panel{min-width:0}.phase-card{border:1px solid var(--line);background:linear-gradient(145deg,#1d2334,#171c2a);padding:clamp(20px,3vw,36px);border-radius:22px;box-shadow:var(--shadow)}.phase-card h2{font-size:clamp(30px,4vw,48px);line-height:1.1;margin:5px 0 10px}.instruction{font-size:clamp(21px,2.2vw,28px);color:#d4daea;margin:0 0 20px;line-height:1.35}.timer-box{text-align:center;padding:15px 10px 20px;border-radius:20px;background:#101522;border:1px solid #343b50;margin:18px 0}.timer{font-variant-numeric:tabular-nums;font-size:clamp(72px,11vw,132px);font-weight:900;line-height:1;letter-spacing:.04em;color:#fff}.timer.done{color:var(--gold);animation:pulse .75s infinite alternate}@keyframes pulse{to{filter:brightness(1.6);text-shadow:0 0 28px #ffd16699}}.timer-controls{display:flex;justify-content:center;gap:10px;margin-top:14px}.stage-controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.role-sidebar h3{margin:0 0 12px;font-size:21px}.role-card{padding:15px;margin-bottom:10px;border:1px solid var(--line);background:#151a28;border-radius:15px}.role-card strong{display:block;font-size:20px}.role-card span{color:var(--muted)}.role-back{color:#9fa8bf;font-size:16px}.role-card revealed{}.hint{background:#282549;border:1px solid #4d4781;color:#e0dcff;padding:16px 18px;border-radius:14px;font-size:21px;font-weight:800;margin:18px 0}.fact-row{display:flex;gap:10px;align-items:center}.fact-row textarea{flex:1}.fact-hidden{font-size:28px;letter-spacing:.15em;color:var(--muted)}.trap-grid{display:grid;grid-template-columns:minmax(220px,.85fr) 1.15fr;gap:18px}.draw-area{padding:20px;border:1px solid var(--line);border-radius:16px;background:#121725;text-align:center}.draw-button{width:100%;font-size:23px;min-height:76px}.trap-card{margin-top:14px;padding:18px;border-radius:14px;background:linear-gradient(135deg,#3b337c,#2b4c71);font-size:20px;font-weight:750;animation:flip .45s ease;min-height:126px;display:grid;place-items:center}@keyframes flip{0%{transform:rotateY(90deg) scale(.9);opacity:.3}100%{transform:none;opacity:1}}.trap-list{padding-left:24px;text-align:left;color:#e6e9f5}.trap-list li{padding:5px 0}.count{margin-top:12px;color:var(--muted);font-weight:750}.publication{background:#111624;border-left:6px solid var(--gold);padding:24px;border-radius:14px;margin:18px 0}.publication h3{font-size:clamp(28px,4vw,44px);line-height:1.15;margin:0 0 14px}.publication p{font-size:clamp(22px,2.8vw,34px);line-height:1.4;margin:0;white-space:pre-wrap}.question-line{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800}.question-count{font-size:34px;color:var(--cyan)}.judge-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.judge-box{background:#121725;border:1px solid var(--line);border-radius:16px;padding:20px}.checkline{display:flex;gap:12px;align-items:flex-start;padding:9px 0;font-size:20px}.checkline input{width:23px;height:23px;accent-color:var(--accent);flex:0 0 auto;margin-top:4px}.suspect-choice{display:grid;gap:10px}.suspect-choice button{text-align:left;font-size:21px}.suspect-choice button.chosen{border-color:var(--gold);background:#473e26}.reveal-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-panel{padding:20px;border:1px solid var(--line);background:#121725;border-radius:16px}.compare-panel h3{margin:0 0 10px;color:var(--cyan);font-size:23px}.compare-panel p{font-size:23px;white-space:pre-wrap;margin:0}.reveal-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.reveal-role{padding:16px;text-align:center;border-radius:15px;border:1px solid var(--line);background:#171d2c;animation:reveal .7s ease both}.reveal-role:nth-child(2){animation-delay:.15s}.reveal-role:nth-child(3){animation-delay:.3s}@keyframes reveal{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}.reveal-role b{display:block;font-size:20px}.secret{display:inline-block;padding:3px 11px;border-radius:99px;margin-top:7px;background:#493d20;color:var(--gold);font-weight:850}.round-result{padding:18px;border-radius:16px;background:#183d34;border:1px solid #387a62;font-size:23px;font-weight:850}.score-strip{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.score-strip span{padding:10px 14px;border-radius:12px;background:#121725;border:1px solid var(--line);font-weight:800}.help-list{font-size:20px;color:#e1e5f1;padding-left:28px}.help-list li{margin:12px 0;padding-left:5px}.rules-list{font-size:19px;color:#e1e5f1;padding-left:26px}.rules-list li{margin:10px 0}.trap-full{padding-left:24px}.trap-full li{margin:13px 0;font-size:19px}.modal-backdrop{position:fixed;inset:0;background:#070911df;z-index:10;display:grid;place-items:center;padding:20px}.modal{width:min(920px,100%);max-height:90vh;overflow:auto}.role-distribution{display:grid;gap:10px}.role-line{display:flex;justify-content:space-between;gap:15px;padding:13px 16px;border-radius:12px;background:#111624;border:1px solid var(--line);font-size:21px}.role-line b{color:var(--gold)}.private-card{text-align:center;padding:28px;background:#101522;border-radius:18px;border:1px solid var(--line);margin:16px 0}.private-card .big-role{font-size:clamp(35px,6vw,64px);font-weight:950;color:var(--gold);line-height:1.15}.private-card .big-name{font-size:26px;color:var(--cyan)}.private-card .countdown{font-size:72px;font-weight:900}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5f4ff;color:#171626;padding:13px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:30;font-weight:800}.flash{position:fixed;inset:0;background:#ffd16655;pointer-events:none;z-index:20;animation:flash .8s ease-out forwards}@keyframes flash{from{opacity:1}to{opacity:0}}.score-table{width:100%;border-collapse:collapse;font-size:20px}.score-table th,.score-table td{padding:14px;border-bottom:1px solid var(--line);text-align:left}.score-table th{color:var(--muted)}.winner{font-size:clamp(28px,4vw,44px);text-align:center;padding:24px;color:var(--gold);font-weight:950}.footer-note{color:var(--muted);font-size:15px;text-align:center;margin:25px 0 8px}.fullscreen-mode .wrap{max-width:1600px}.fullscreen-mode .phase-card{min-height:70vh}.fullscreen-mode .instruction{font-size:30px}
@media(max-width:900px){.phase-layout{grid-template-columns:1fr}.role-sidebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.role-sidebar h3{grid-column:1/-1}.role-card{margin:0}.trap-grid{grid-template-columns:1fr}.role-back{display:none}}
@media(max-width:650px){.wrap{padding:14px}.topbar{align-items:flex-start}.brand{font-size:17px}.top-actions button{font-size:14px;padding:10px}.form-grid{grid-template-columns:1fr}.setting-row{align-items:flex-start;flex-direction:column}.range-line{min-width:0;width:100%}.judge-grid,.reveal-cols{grid-template-columns:1fr}.role-sidebar{grid-template-columns:1fr}.phase-card{padding:20px}.stage-controls{flex-direction:column}.stage-controls button{width:100%}.reveal-roles{grid-template-columns:1fr}.role-line{font-size:17px}.hero{min-height:78vh}.hero h1{font-size:44px}}

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
(() => {
'use strict';
const PHASES = [
 {name:'Настоящий факт',seconds:120,instruction:'Источник придумывает один настоящий, безопасный и достаточно интересный факт о себе. Ведущий записывает его здесь и прячет от расследователя.'},
 {name:'Секретные роли',seconds:60,instruction:'Источник и редактор получают секретные роли. Они не раскрываются до финального этапа. Выберите способ раздачи ниже.'},
 {name:'Работа редакции',seconds:180,instruction:'Редактор получает факт и вытянутые карточки-ловушки. За три минуты создайте громкий заголовок и короткую публикацию.'},
 {name:'Начало расследования',seconds:60,instruction:'Расследователь внимательно изучает публикацию. Пока не задавайте вопросы: подготовьтесь искать расхождения.'},
 {name:'Допрос',seconds:360,instruction:'Расследователь задаёт вопросы обоим игрокам строго по очереди. Отвечать можно только «Да» или «Нет». Счёт вопросов ведёт ведущий.'},
 {name:'Финальный вердикт',seconds:120,instruction:'Расследователь объявляет, какие сведения искажены, кто предатель и почему публикация вызывает сомнения. Ведущий отмечает это ниже.'},
 {name:'Раскрытие',seconds:null,instruction:'Сравните исходный факт с публикацией, вскройте секретные роли и узнайте результат раунда.'}
];
const TRAPS = [
 '«Сенсация» — преврати обычное событие в сенсационную новость.',
 '«Преувеличение» — увеличь масштаб события.',
 '«Новая деталь» — добавь вымышленную подробность.',
 '«Изменение числа» — измени количество, дату или время.',
 '«Заголовок» — сделай заголовок максимально громким.',
 '«Интрига» — добавь деталь, которая заставит читателя удивиться.',
 '«Новость и так интересная» — менять ничего не нужно — так ты запутаешь всех.'
];

const defaultState = {screen:'home',players:['Игрок 1','Игрок 2','Игрок 3'],hostSeparate:true,dealing:'eyes',totalRounds:3,interrogationMinutes:6,round:1,phase:0,secondsLeft:120,running:false,interval:null,questionCount:0,fact:'',factHidden:true,title:'',article:'',trapDeck:[],drawn:[],treason:null,truthfulness:[],selectedDistortions:[],confirmedDistortions:[],reasonChecked:false,editorTasks:false,secretSequence:0,secretTimer:null,secretVisible:false,scores:{},rounds:[],resultsRecorded:false};
let S={...defaultState};
const app=document.getElementById('app'), modalRoot=document.getElementById('modalRoot');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function roundPlayers(){const shift=(S.round-1)%3;return [S.players[shift],S.players[(shift+1)%3],S.players[(shift+2)%3]]}
function rolesForRound(){const p=roundPlayers();return [
 {role:'Источник информации',name:p[0],secret:S.truthfulness[0]},
 {role:'Редактор новостей',name:p[1],secret:S.truthfulness[1]},
 {role:'Независимый расследователь',name:p[2],secret:null}
]}
function phaseDuration(index){return index===4?S.interrogationMinutes*60:(PHASES[index].seconds||0)}
function fmt(t){t=Math.max(0,t|0);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function setScreen(screen){S.screen=screen;render();}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="notice">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2500)}
function flash(){const el=document.createElement('div');el.className='flash';document.body.append(el);setTimeout(()=>el.remove(),900)}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[0,.18,.36].forEach((delay,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=[660,880,1040][i];gain.gain.setValueAtTime(.0001,ctx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+delay+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+.22);osc.connect(gain);gain.connect(ctx.destination);osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+.24)});setTimeout(()=>ctx.close(),1000)}catch(e){}}
function stopTimer(){if(S.interval){clearInterval(S.interval);S.interval=null}S.running=false;const b=document.querySelector('.timer-controls .primary');if(b)b.textContent='▶ Старт';}
function startTimer(){if(S.secondsLeft<=0){S.secondsLeft=phaseDuration(S.phase);const t=document.querySelector('.timer');if(t)t.textContent=fmt(S.secondsLeft)}if(S.running||S.phase===6)return;S.running=true;const b=document.querySelector('.timer-controls .primary');if(b)b.textContent='Ⅱ Пауза';S.interval=setInterval(()=>{if(S.secondsLeft>0){S.secondsLeft--;const t=document.querySelector('.timer');if(t)t.textContent=fmt(S.secondsLeft);if(S.secondsLeft===0){stopTimer();if(t)t.classList.add('done');beep();flash()}}},1000)}
function resetTimer(){stopTimer();S.secondsLeft=phaseDuration(S.phase);render()}
function resetRound(){stopTimer();if(S.secretTimer)clearInterval(S.secretTimer);S.phase=0;S.secondsLeft=120;S.questionCount=0;S.fact='';S.factHidden=true;S.title='';S.article='';S.trapDeck=[...TRAPS];S.drawn=[];S.treason=null;S.truthfulness=[];S.selectedDistortions=[];S.confirmedDistortions=[];S.reasonChecked=false;S.editorTasks=false;S.resultsRecorded=false;S.secretSequence=0;S.secretVisible=false}
function beginGame(){const names=[...document.querySelectorAll('[data-player]')].map(i=>i.value.trim());if(names.some(n=>!n)){toast('Введите имена всех трёх игроков');return}if(new Set(names.map(n=>n.toLocaleLowerCase())).size<3){toast('У каждого игрока должно быть своё имя');return}S.players=names;S.hostSeparate=document.querySelector('#hostSeparate').checked;S.totalRounds=Number(document.querySelector('#roundCount').value);S.dealing=document.querySelector('input[name=dealing]:checked').value;S.interrogationMinutes=Number(document.getElementById('interrogationMinutes').value);S.round=1;S.scores=Object.fromEntries(names.map(n=>[n,0]));S.rounds=[];startRound();}
function startRound(){resetRound();S.truthfulness=Math.random()<.5?['Правдивый','Предатель']:['Предатель','Правдивый'];S.screen='game';render()}
function advance(){stopTimer();if(S.secretTimer){clearInterval(S.secretTimer);S.secretTimer=null;S.secretVisible=false}if(S.phase===5){scoreRound();S.phase=6;S.secondsLeft=0;S.running=false;render();return}if(S.phase===6){if(S.round<S.totalRounds){S.round++;startRound()}else{S.screen='results';render()}return}stopTimer();S.phase++;S.secondsLeft=phaseDuration(S.phase);if(S.phase===4)S.questionCount=0;render()}
function drawTrap(){if(!S.trapDeck.length){toast('Все 7 карточек уже вытянуты');return}const i=Math.floor(Math.random()*S.trapDeck.length);const [card]=S.trapDeck.splice(i,1);S.drawn.push(card);render()}
function dealEyes(){S.secretSequence=0;showPrivateRole()}
function showPrivateRole(){if(S.secretTimer)clearInterval(S.secretTimer);if(S.secretSequence>=2){S.secretVisible=false;render();return}S.secretVisible=true;let remain=5;render();S.secretTimer=setInterval(()=>{remain--;const el=document.getElementById('privateCountdown');if(el)el.textContent=String(remain);if(remain<=0){clearInterval(S.secretTimer);S.secretVisible=false;S.secretSequence++;render();if(S.secretSequence<2)setTimeout(showPrivateRole,350)}},1000)}
async function copyRoles(){const text=rolesForRound().map(x=>`${x.name} — ${x.secret||'Без секретной роли'}`).join('\n');try{await navigator.clipboard.writeText(text);toast('Роли скопированы — разошлите каждому лично')}catch(e){const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();toast('Роли скопированы — разошлите каждому лично')}}
function assignScore(name,pts){if(name&&Object.prototype.hasOwnProperty.call(S.scores,name))S.scores[name]+=pts}
function scoreRound(){if(S.resultsRecorded)return;const rp=roundPlayers();const traitorIndex=S.truthfulness.indexOf('Предатель');const investigatorGuessIndex=S.treason==='source'?0:S.treason==='editor'?1:-1;const guessed=investigatorGuessIndex===traitorIndex;const distortions=S.selectedDistortions.filter(i=>S.confirmedDistortions.includes(i)).length;let investigatorPoints=(guessed?3:0)+distortions+(S.reasonChecked?2:0);let traitorPoints=guessed?0:3;let editorPoints=S.editorTasks?2:0;assignScore(rp[2],investigatorPoints);assignScore(rp[traitorIndex],traitorPoints);assignScore(rp[1],editorPoints);S.rounds.push({round:S.round,investigator:rp[2],investigatorPoints,traitor:rp[traitorIndex],traitorPoints,editor:rp[1],editorPoints,distortions,guessed});S.resultsRecorded=true}
// Local shared-screen mode: no account, connection service, or network synchronization.
function startLocalMode(){stopTimer();S.screen='setup';render()}
function home(){return `<main class="wrap screen"><header class="topbar"><div class="brand">🕵️ <span>ФАКТЧЕКИНГ</span></div><div class="top-actions"><button class="ghost" onclick="toggleFullscreen()">⛶ Полный экран</button></div></header><section class="hero"><div class="hero-inner"><div class="eyebrow">Игра для трёх участников · без регистрации и подключения</div><h1>Фактчекинг:<br><em>поймай предателя</em></h1><p>Ведущий открывает игру и показывает экран в видеозвонке. Трое игроков общаются голосом и играют вместе — каждый раунд управляется с одного экрана.</p><div class="button-row"><button class="primary" onclick="startLocalMode()">Начать игру</button><button onclick="showHelp()">Как играть в видеозвонке</button><button onclick="showRules()">Правила</button></div><p class="subtle" style="font-size:17px;margin-top:26px">Без комнат, кодов и сетевого подключения</p></div></section></main>`}
function setup(){return `<main class="wrap screen"><header class="topbar"><div class="brand">🕵️ <span>НАСТРОЙКА ИГРЫ</span></div><button onclick="setScreen('home')">← На главную</button></header><section class="card narrow"><div class="eyebrow">Перед стартом</div><h1 class="section-title">Кто сегодня в редакции?</h1><p class="subtle">Роли по кругам автоматически переходят: Источник → Редактор → Расследователь → Источник.</p><div class="form-grid">${['Игрок 1','Игрок 2','Игрок 3'].map((n,i)=>`<div class="field"><label for="player${i}">${['Источник информации','Редактор новостей','Независимый расследователь'][i]}</label><input id="player${i}" data-player value="${esc(S.players[i])}" maxlength="32" autocomplete="off"></div>`).join('')}</div><div class="setting-row"><div><strong>Ведущий — отдельный участник</strong><span class="subtle">Если ведущий не отдельный, один из трёх игроков также управляет экраном и вводит данные.</span></div><label><input id="hostSeparate" type="checkbox" ${S.hostSeparate?'checked':''}> Да, отдельный ведущий</label></div><div class="setting-row"><div><strong>Способ раздачи секретных ролей</strong><span class="subtle">Выберите, как сохранить роли в тайне.</span></div><div class="segmented"><label><input type="radio" name="dealing" value="eyes" ${S.dealing==='eyes'?'checked':''}> Закройте глаза</label><label><input type="radio" name="dealing" value="message" ${S.dealing==='message'?'checked':''}> Рассылка ведущему</label></div></div><div class="setting-row"><div><strong>Количество кругов</strong><span class="subtle">После каждого круга роли игроков меняются.</span></div><div class="range-line"><input id="roundCount" type="range" min="1" max="5" value="${S.totalRounds}" oninput="document.getElementById('roundVal').textContent=this.value"><b id="roundVal">${S.totalRounds}</b> круг(а)</div></div><div class="setting-row"><div><strong>Длительность допроса</strong><span class="subtle">По умолчанию — 6 минут, можно настроить от 5 до 7.</span></div><div class="range-line"><input id="interrogationMinutes" type="range" min="5" max="7" value="${S.interrogationMinutes}" oninput="document.getElementById('questionTimeVal').textContent=this.value"><b id="questionTimeVal">${S.interrogationMinutes}</b> мин</div></div><div class="button-row" style="margin-top:26px"><button class="primary" onclick="beginGame()">Начать первый круг →</button></div></section></main>`}
function roleSidebar(){return `<aside class="role-sidebar"><h3>Игроки за столом</h3>${rolesForRound().map((p,i)=>`<div class="role-card"><strong>${esc(p.name)}</strong><span>${p.role}</span><div class="role-back">${S.phase===6?`<b style="color:var(--gold)">${p.secret||'Без секретной роли'}</b>`:'🔒 Секретная роль скрыта'}</div></div>`).join('')}</aside>`}
function factInput(){return `<div class="field"><label>Факт источника — ведущий вводит со слов игрока</label>${S.factHidden?`<div class="fact-row"><div class="fact-hidden" style="flex:1;padding:16px;background:#101522;border:1px solid var(--line);border-radius:12px">${S.fact?'•••':'Факт пока не введён'}</div><button onclick="S.factHidden=false;render()">${S.fact?'Показать / изменить':'Ввести факт'}</button></div>`:`<div class="fact-row"><textarea id="factInput" placeholder="Например: однажды я прошёл пешком 40 километров за день…" oninput="S.fact=this.value">${esc(S.fact)}</textarea><button onclick="S.factHidden=true;render()">Скрыть</button></div><p class="subtle">Факт сейчас виден на общем экране. Нажмите «Скрыть» сразу после ввода.</p>`}</div>`}
function roleDealing(){if(S.dealing==='message')return `<div class="hint">🔐 Роли назначены случайно: источник и редактор получили по одной карточке — «Правдивый» и «Предатель». Расследователь секретной роли не получает.</div><div class="role-distribution">${rolesForRound().map(x=>`<div class="role-line"><span>${esc(x.name)}</span><b>${x.secret||'Без секретной роли'}</b></div>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="copyRoles()">▣ Скопировать роли для личной рассылки</button><p class="subtle">Передайте каждому игроку только его строку в личном сообщении.</p>`;return `<div class="hint">👀 Режим «Закройте глаза»: ведущий объявляет имя игрока. Только он смотрит на экран, остальные отводят взгляд. Карточка показывается 5 секунд.</div>${S.secretVisible?`<div class="private-card"><div class="big-name">${esc(roundPlayers()[S.secretSequence])}, откройте глаза и смотрите на экран!</div><div class="big-role">${esc(S.truthfulness[S.secretSequence])}</div><div class="countdown" id="privateCountdown">5</div><div>Остальные игроки — отведите взгляд</div></div>`:S.secretSequence>=2?`<div class="hint">✅ Роли выданы. Игроки, сохраните их в тайне до раскрытия.</div>`:`<button class="primary" onclick="dealEyes()">Начать раздачу ролей</button>`}<p class="subtle">Роли показываются по одной: сначала Источнику, затем Редактору. Расследователь карточки не получает.</p>`}
function trapStage(){return `<div class="trap-grid"><div class="draw-area"><button class="primary draw-button" onclick="drawTrap()" ${S.trapDeck.length?'':'disabled'}>🃏 Вытянуть карточку</button><div id="lastTrap">${S.drawn.length?`<div class="trap-card">${esc(S.drawn[S.drawn.length-1])}</div>`:'<div class="subtle" style="padding:20px">Нажмите, чтобы случайно вытянуть ловушку</div>'}</div><div class="count">Вытянуто ${S.drawn.length} из 7</div></div><div><h3 style="margin-top:0">Вытянутые карточки</h3>${S.drawn.length?`<ol class="trap-list">${S.drawn.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`:'<p class="subtle">Карточек пока нет.</p>'}</div></div><div class="field" style="margin-top:22px"><label for="titleInput">Заголовок публикации</label><input id="titleInput" type="text" value="${esc(S.title)}" placeholder="Громкий заголовок новости" oninput="S.title=this.value"></div><div class="field" style="margin-top:15px"><label for="articleInput">Текст публикации</label><textarea id="articleInput" style="min-height:160px" placeholder="Короткий текст новости…" oninput="S.article=this.value">${esc(S.article)}</textarea></div>`}
function publication(){return `<article class="publication"><h3>${esc(S.title||'Заголовок публикации появится здесь')}</h3><p>${esc(S.article||'Текст публикации появится здесь.')}</p></article>`}
function questionPanel(){return `<div class="hint">Отвечать можно только «Да» или «Нет» — строго по очереди</div><div class="question-line"><span>Вопрос № <b class="question-count">${S.questionCount+1}</b></span><button class="success" onclick="S.questionCount++;render()">＋ вопрос</button><span class="subtle">Задано: ${S.questionCount}</span></div>`}
function verdict(){const claims=(S.article||'').split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(Boolean);const parts=claims.length?claims:['Добавьте текст публикации на этапе «Работа редакции», чтобы отметить конкретные утверждения.'];return `<div class="judge-grid"><div class="judge-box"><h3>Какие части публикации назвал искажёнными?</h3><p class="subtle">Отметьте слова или утверждения, которые указал расследователь. Затем подтвердите, какие из них действительно искажены по сравнению с фактом.</p>${parts.map((x,i)=>`<div class="checkline" style="display:block;border-bottom:1px solid var(--line)"><div style="font-size:19px;margin-bottom:7px">«${esc(x)}»</div><label style="display:inline-flex;gap:8px;align-items:center;margin-right:15px"><input type="checkbox" ${S.selectedDistortions.includes(i)?'checked':''} onchange="toggleVerdictArray('selectedDistortions',${i},this.checked)"><span>Назвал искажением</span></label><label style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" ${S.confirmedDistortions.includes(i)?'checked':''} onchange="toggleVerdictArray('confirmedDistortions',${i},this.checked)"><span>Это действительно искажение (+1, если названо)</span></label></div>`).join('')}<label class="checkline" style="border-top:1px solid var(--line);margin-top:10px"><input type="checkbox" ${S.reasonChecked?'checked':''} onchange="S.reasonChecked=this.checked"><span>Расследователь объяснил, почему новость вызывает сомнения (+2)</span></label><label class="checkline"><input type="checkbox" ${S.editorTasks?'checked':''} onchange="S.editorTasks=this.checked"><span>Редактор выполнил задания всех вытянутых карточек (+2 редактору)</span></label></div><div class="judge-box"><h3>Кого назвал предателем?</h3><p class="subtle">Выберите одного из двух подозреваемых.</p><div class="suspect-choice"><button class="${S.treason==='source'?'chosen':''}" onclick="S.treason='source';render()">🎙️ Источник: ${esc(roundPlayers()[0])}</button><button class="${S.treason==='editor'?'chosen':''}" onclick="S.treason='editor';render()">📰 Редактор: ${esc(roundPlayers()[1])}</button></div></div></div>`}
function revealPanel(){const rec=S.rounds.find(r=>r.round===S.round)||{};const traitorName=roundPlayers()[S.truthfulness.indexOf('Предатель')];return `<div class="reveal-cols"><div class="compare-panel"><h3>Так было — настоящий факт</h3><p>${esc(S.fact||'Факт не был введён.')}</p></div><div class="compare-panel"><h3>Так стало — публикация</h3><h3 style="color:var(--gold);font-size:25px">${esc(S.title||'Без заголовка')}</h3><p>${esc(S.article||'Текст публикации не введён.')}</p></div></div><h3 style="font-size:25px;margin:23px 0 10px">Вскрытие секретных ролей</h3><div class="reveal-roles">${rolesForRound().map(x=>`<div class="reveal-role"><b>${esc(x.name)}</b><span>${x.role}</span><div class="secret">${x.secret||'Расследователь'}</div></div>`).join('')}</div><div class="round-result">${rec.guessed?'🎯 Расследователь угадал предателя!':'🕵️ Предатель запутал расследователя!'} Предатель — ${esc(traitorName)}.<br><span style="font-size:18px">Баллы за этот круг уже начислены по таблице.</span></div><div class="score-strip">${rec.guessed?'<span>+3 за предателя расследователю</span>':'<span>+3 предателю за успешную путаницу</span>'}<span>+${rec.distortions||0} за искажения</span>${S.reasonChecked?'<span>+2 за объяснение сомнений</span>':''}${S.editorTasks?'<span>+2 редактору за карточки</span>':''}</div>`}
function hostPrivateRole(){if(S.hostSeat<0)return '';const index=roundPlayers().indexOf(S.hostSeat);if(index<0||index>1)return '<div class="hint">У ведущего нет секретной роли в этом круге.</div>';return `<div class="private-card"><div class="big-name">Секретная роль ведущего-игрока</div><div class="big-role">${esc(S.truthfulness[index])}</div></div>`}
function phaseBody(){switch(S.phase){case 0:return factInput();case 1:return roleDealing();case 2:return trapStage();case 3:return `<div class="hint">Публикация для изучения. Подготовьтесь к допросу — вопросы начнутся на следующем этапе.</div>${publication()}`;case 4:return `${publication()}${questionPanel()}`;case 5:return `${publication()}${verdict()}`;case 6:return revealPanel();}}
function game(){const p=PHASES[S.phase];return `<main class="wrap screen"><header class="topbar"><div><div class="brand">🕵️ <span>ФАКТЧЕКИНГ</span></div><div class="round-chip">Круг ${S.round} из ${S.totalRounds} · Роли меняются каждый круг</div></div><div class="top-actions"><button class="ghost" onclick="toggleFullscreen()">⛶ Полный экран</button><button onclick="showHelp()">Справка</button></div></header><div class="phase-progress">${PHASES.map((_,i)=>`<div class="phase-dot ${i<S.phase?'done':i===S.phase?'current':''}"></div>`).join('')}</div><div class="phase-layout"><section class="main-panel"><div class="phase-card"><div class="eyebrow">Этап ${S.phase+1} из 7</div><div class="game-head"><div><h2>${p.name}</h2><p class="instruction">${p.instruction}</p></div><span class="pill">${p.seconds===null?'Без таймера':fmt(phaseDuration(S.phase))}</span></div>${S.phase!==6?`<div class="timer-box"><div class="timer ${S.secondsLeft===0?'done':''}" aria-live="polite">${fmt(S.secondsLeft)}</div><div class="timer-controls"><button class="primary" onclick="S.running?stopTimer():startTimer()">${S.running?'Ⅱ Пауза':'▶ Старт'}</button><button onclick="resetTimer()">↺ Сброс</button></div></div>`:''}<div class="phase-content">${S.phase===1&&S.hostSeparate?`<div class="hint">Ведущий показывает этот экран участникам по очереди. Остальные игроки в это время отводят взгляд.</div>${roleDealing()}`:phaseBody()}</div><div class="stage-controls"><button class="ghost" onclick="showRules()">Правила</button><button class="primary" onclick="advance()">${S.phase===6?(S.round<S.totalRounds?'Следующий круг →':'Завершить турнир →'):'Далее →'}</button></div></div></section>${roleSidebar()}</div><div class="footer-note">Ведущий управляет игрой; все трое участвуют голосом в видеозвонке. Переход к следующему этапу — вручную.</div></main>`}
function results(){const vals=Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);const top=vals[0]?.[1]??0;const winners=vals.filter(x=>x[1]===top).map(x=>x[0]);return `<main class="wrap screen"><header class="topbar"><div class="brand">🏆 <span>ИТОГИ ТУРНИРА</span></div><button onclick="toggleFullscreen()">⛶ Полный экран</button></header><section class="card narrow"><div class="eyebrow" style="text-align:center">${S.totalRounds} ${S.totalRounds===1?'круг сыгран':S.totalRounds<5?'круга сыграно':'кругов сыграно'}</div><div class="winner">${winners.length===1?`Победитель — ${esc(winners[0])}!`:`Ничья — ${winners.map(esc).join(' и ')}!`}</div><table class="score-table"><thead><tr><th>Место</th><th>Игрок</th><th>Баллы</th></tr></thead><tbody>${vals.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join('')}</tbody></table><h2 style="margin-top:32px">Результаты по кругам</h2><div style="overflow:auto"><table class="score-table"><thead><tr><th>Круг</th><th>Расследователь</th><th>Предатель</th><th>Редактор</th></tr></thead><tbody>${S.rounds.map(r=>`<tr><td>${r.round}</td><td>${esc(r.investigator)} · ${r.investigatorPoints}</td><td>${esc(r.traitor)} · ${r.traitorPoints}</td><td>${esc(r.editor)} · ${r.editorPoints}</td></tr>`).join('')}</tbody></table></div><div class="button-row" style="margin-top:26px"><button class="primary" onclick="newTournament()">Ещё турнир</button><button onclick="changePlayers()">Сменить игроков</button></div></section></main>`}
function render(){document.body.classList.toggle('fullscreen-mode',!!document.fullscreenElement);app.innerHTML=S.screen==='home'?home():S.screen==='setup'?setup():S.screen==='game'?game():results()}
function showModal(title,body){modalRoot.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal card"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><h2 class="section-title" style="font-size:34px;margin:0">${title}</h2><button onclick="closeModal()">✕ Закрыть</button></div>${body}</section></div>`}
function showHelp(){showModal('Как играть в видеозвонке',`<ol class="help-list"><li>Начните видеозвонок. Ведущий открывает игру и показывает экран.</li><li>Введите имена трёх игроков. Ведущий может быть отдельным участником или играть за одного из троих.</li><li>Источник сообщает факт редактору лично или так, чтобы расследователь не слышал. Ведущий вводит факт и нажимает «Скрыть».</li><li>На этапе секретных ролей ведущий показывает карточки Источнику и Редактору по очереди. Остальные отворачиваются; либо ведущий рассылает роли лично.</li><li>Редактор вытягивает ловушки и передаёт готовую новость ведущему для ввода.</li><li>Расследователь задаёт вопросы голосом. Отвечают только «Да» или «Нет», строго по очереди. Ведущий отмечает вопросы и этапы на общем экране.</li><li>Ведущий отмечает вердикт, затем нажимает «Раскрытие». Поменяйтесь ролями в следующем круге.</li></ol><div class="hint">Сетевое подключение не используется. Игрокам достаточно быть в одном голосовом видеозвонке и видеть экран ведущего.</div>`)}
function showRules(){showModal('Правила игры',`<h3>Суть игры</h3><p>Участники становятся героями небольшой редакции. Один рассказывает настоящий факт из своей жизни, второй превращает его в новостную публикацию, используя карточки-ловушки с заданиями на искажение информации. Третий — независимый расследователь: он выясняет, что в публикации правда, что было изменено и кто получил роль предателя.</p><h3>Роли игроков</h3><ol class="rules-list"><li><b>Источник информации</b> — записывает один настоящий, но не слишком известный факт о себе (необычное событие, достижение, интересный случай). Факт — правдивый, безопасный, достаточно интересный для новости. На допросе отвечает только «Да» или «Нет».</li><li><b>Редактор новостей</b> — получает факт и за 3 минуты превращает его в новостную публикацию (громкий заголовок + короткий текст), используя карточки-ловушки. На допросе отвечает только «Да» или «Нет».</li><li><b>Независимый расследователь</b> — не знает исходный факт и секретные роли. Изучает публикацию, задаёт вопросы обоим игрокам (ответы — только «Да»/«Нет») и определяет, какие сведения искажены и кто предатель.</li></ol><h3>Секретные роли</h3><p>В начале раунда Источник и Редактор случайно получают по одной секретной карточке: «Правдивый» (отвечает честно) или «Предатель» (пытается запутать расследователя). У Расследователя карточки нет. Роли не раскрываются до этапа «Раскрытие».</p><p><b>Карточки-ловушки определяют, как редактор преобразует информацию, а секретная роль влияет на поведение на допросе.</b></p><h3>Семь карточек-ловушек</h3><ol class="trap-full">${TRAPS.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><h3>Этапы и таймеры</h3><ol class="rules-list">${PHASES.map(p=>`<li><b>${esc(p.name)}</b> — ${p.seconds===null?'без таймера':fmt(p.seconds)}. ${esc(p.instruction)}</li>`).join('')}</ol><h3>Система оценки</h3><ul class="rules-list"><li>Расследователь правильно определил предателя: +3.</li><li>Каждое правильно выявленное искажение: +1.</li><li>Расследователь объяснил, почему новость вызывает сомнения: +2.</li><li>Предатель успешно запутал расследователя (расследователь не нашёл предателя): +3.</li><li>Редактор выполнил задания всех вытянутых карточек-ловушек: +2.</li></ul><h3>Турнир</h3><p>Игра состоит из кругов по 16–20 минут. После каждого круга участники меняются ролями (Источник → Редактор → Расследователь → Источник). Побеждает набравший больше всего баллов по итогам всех кругов. По умолчанию — 3 круга, количество кругов настраивается.</p>`)}
function closeModal(){modalRoot.innerHTML=''}
function toggleDistortion(i,on){S.selectedDistortions=on?[...new Set([...S.selectedDistortions,i])]:S.selectedDistortions.filter(x=>x!==i)}
function toggleVerdictArray(key,i,on){S[key]=on?[...new Set([...S[key],i])]:S[key].filter(x=>x!==i)}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function changePlayers(){S.screen='setup';render()}
function newTournament(){S.players=[...S.players];S.totalRounds=3;S.round=1;S.scores={};S.rounds=[];S.screen='setup';render()}
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen-mode',!!document.fullscreenElement));
